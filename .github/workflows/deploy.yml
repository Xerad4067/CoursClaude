# Publie le site du cours sur GitHub Pages à chaque push sur main.
# Source : documentation officielle d'Astro « Deploy to GitHub Pages » (vérifiée le 06/10/2026).
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ». Dépôt public avec GitHub Free.
name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet de lancer la publication à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer, construire et téléverser le site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
