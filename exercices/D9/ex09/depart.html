<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Mon portefeuille</title>
  </head>
  <body>
    <h1>Mon portefeuille</h1>
    <p>Argent : <span id="argent">60</span> €</p>
    <p id="info"></p>
    <button id="gagner" type="button">Gagner 50 €</button>
    <button id="depenser" type="button">Dépenser 40 €</button>

    <script>
      // 1. Une variable « argent » qui vaut 60 au départ (c'est l'état).
      // 2. Récupère les éléments avec document.querySelector.
      // 3. Au clic sur « Gagner » : ajoute 50 et affiche le nouveau montant.
      // 4. Au clic sur « Dépenser » : retire 40 SI l'argent suffit, sinon écris « Pas assez d'argent » dans #info.
    </script>
  </body>
</html>
