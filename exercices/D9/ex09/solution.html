<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Mon portefeuille</title>
  </head>
  <body>
    <h1>Mon portefeuille</h1>
    <p>Argent : <span id="argent">60</span> €</p>
    <p id="info"></p>
    <button id="gagner" type="button">Gagner 50 €</button>
    <button id="depenser" type="button">Dépenser 40 €</button>

    <script>
      // L'ÉTAT : la vraie valeur de l'argent vit dans cette variable, pas dans la page
      let argent = 60;

      const affichageArgent = document.querySelector("#argent");
      const info = document.querySelector("#info");

      // La page n'est qu'un reflet de l'état : on la remet à jour après chaque changement
      function afficher() {
        affichageArgent.textContent = argent;
      }

      document.querySelector("#gagner").addEventListener("click", () => {
        argent = argent + 50;
        info.textContent = "";
        afficher();
      });

      document.querySelector("#depenser").addEventListener("click", () => {
        if (argent >= 40) {
          argent = argent - 40;
          info.textContent = "";
        } else {
          info.textContent = "Pas assez d'argent";
        }
        afficher();
      });

      afficher();
    </script>
  </body>
</html>
