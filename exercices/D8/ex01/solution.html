<!doctype html>
<!-- La première ligne dit au navigateur : « ceci est une page HTML moderne ». -->
<html lang="fr"> <!-- lang="fr" : la page est écrite en français -->
  <head>
    <!-- Le head contient des informations SUR la page (rien de tout ça ne s'affiche dans la page). -->
    <meta charset="utf-8"> <!-- pour que les accents (é, è, à) s'affichent bien -->
    <title>Port-Soleil RP</title> <!-- le nom de l'onglet du navigateur -->
  </head>
  <body>
    <!-- Le body contient ce que le visiteur voit. -->
    <h1>Port-Soleil RP</h1>
    <p>Bienvenue sur le serveur roleplay de la ville de Port-Soleil.</p>
  </body>
</html>
