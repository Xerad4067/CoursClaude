<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Garage de Kim</title>
    <style>
      h1 { text-transform: uppercase; }
      .secret { display: none; }
      #prix { text-transform: lowercase; }
      p.promo { text-transform: uppercase; }
    </style>
  </head>
  <body>
    <h1>Garage de Kim</h1>
    <p>Réparation : 80 €</p>
    <p class="secret">Marge du garage : 30 €</p>
    <p id="prix">Remorquage : 120 €</p>
    <p class="promo">Promo ce week-end</p>
    <ul>
      <li class="secret">Stock de pneus : 12</li>
      <li>Ouvert de 9 h à 18 h</li>
      <li style="display: none">Alarme : désactivée</li>
    </ul>
  </body>
</html>
