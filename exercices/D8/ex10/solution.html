<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Tarifs du garage</title>
    <style>
      /* Le point vise une CLASSE : le nom doit être identique à celui du HTML, tiret compris */
      .tarif-ami { display: none; }
      /* Le dièse vise un ID. Ici l'élément a un id, donc le dièse est le bon choix. */
      #note-staff { display: none; }
    </style>
  </head>
  <body>
    <h1>Tarifs du garage</h1>
    <p>Vidange : 60 €</p>
    <p class="tarif-ami">Vidange pour les amis : 10 €</p>
    <p id="note-staff">Note du staff : revoir les prix en décembre.</p>
    <p>Pneus : 40 € pièce</p>
  </body>
</html>
